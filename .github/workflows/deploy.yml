name: CI - Integration Tests and Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloud_backend_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cloud_backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_NAME: cloud_backend_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ci-only-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit --workspace hello-function

      - name: Apply database schema
        run: |
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            --host="$DATABASE_HOST" \
            --port="$DATABASE_PORT" \
            --username="$DATABASE_USER" \
            --dbname="$DATABASE_NAME" \
            --set=ON_ERROR_STOP=1 \
            --file=database/schema.sql

      - name: Seed integration test users
        run: node database/seed-test-users.mjs

      - name: Run integration tests
        run: npm run test:integration --workspace hello-function

      - name: Build function
        run: npm run build:function

      - name: Package function
        run: npm run package:function

      - name: Verify package
        run: |
          unzip -t build/hello-function.zip
          unzip -Z1 build/hello-function.zip | grep -Fx 'dist/index.js'
          unzip -Z1 build/hello-function.zip | grep -Fx 'package.json'
