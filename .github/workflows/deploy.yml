name: Build and Deploy Hello Function

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: project-34fb4314-f457-40cc-9e1
      REGION: us-central1
      FUNCTION_NAME: hello-function
      BUCKET_NAME: cloud-backend-lab-source-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build function
        run: npm run build:function

      - name: Package function
        run: npm run package:function

      - name: Verify package
        run: unzip -l ./build/hello-function.zip

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify Google Cloud authentication
        run: gcloud auth list

      - name: Upload function package
        run: |
          gcloud storage cp \
            ./build/hello-function.zip \
            gs://${BUCKET_NAME}/hello-function.zip

      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy ${FUNCTION_NAME} \
            --gen2 \
            --project=${PROJECT_ID} \
            --region=${REGION} \
            --runtime=nodejs24 \
            --source=gs://${BUCKET_NAME}/hello-function.zip \
            --entry-point=hello \
            --quiet

      - name: Verify deployment
        run: |
          gcloud functions describe ${FUNCTION_NAME} \
            --gen2 \
            --project=${PROJECT_ID} \
            --region=${REGION}