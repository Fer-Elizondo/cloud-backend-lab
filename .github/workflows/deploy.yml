name: Build Hello Function

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build function
        run: npm run build:function

      - name: Package function
        run: npm run package:function

      - name: Verify package
        run: unzip -l ./build/hello-function.zip